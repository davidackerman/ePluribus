name: Pages

# The site at https://davidackerman.github.io/ePluribus/: web/ as it is (no build step),
# pushed to the gh-pages branch, as coresample does. Pages serves that branch once it is
# switched on (Settings > Pages > Deploy from a branch: gh-pages, / (root)).
on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write   # pushes the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is complete
        run: |
          for f in index.html app.js core.js worker.js maps.js share.js stats.js gif.js config.js style.css \
                   og.png packs/packs.json samples/demo-recipe.txt samples/mona.jpg; do
            [ -f "web/$f" ] || { echo "::error::web/$f is missing"; exit 1; }
          done
          du -sh web

      # Pages' CDN caches each file for 10 minutes, so right after a deploy a visitor could get
      # the new app.js with an old maps.js (and a broken page). Stamping this deploy's version
      # on every module, the worker and the catalog makes each page load one consistent set.
      - name: Version the files
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#; s#(new URL\(\"\./worker\.js)\"#\1?v=$V\"#; s#fetch\(\"(packs/packs\.json|samples/demo-recipe\.txt)\"\)#fetch(\"\1?v=$V\")#" web/*.js
          sed -i -E "s#href=\"style\.css\"#href=\"style.css?v=$V\"#; s#src=\"app\.js\"#src=\"app.js?v=$V\"#" web/index.html
          for f in app.js worker.js share.js stats.js index.html; do
            grep -q "?v=$V" "web/$f" || { echo "::error::web/$f was not versioned"; exit 1; }
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web
          force_orphan: true
          full_commit_message: "Deploy ${{ github.sha }}"
